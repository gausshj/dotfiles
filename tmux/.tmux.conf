# ─────────────────────────────────────────────
# Platform detection
# ─────────────────────────────────────────────
if-shell 'test "$(uname -s)" = "Darwin"' 'set -g default-shell /bin/zsh' 'set -g default-shell /usr/bin/zsh'
if-shell 'test "$(uname -s)" = "Darwin"' 'set -g default-command "reattach-to-user-namespace -l zsh"' 'set -g default-command "/usr/bin/zsh"'

# ─────────────────────────────────────────────
# Basic
# ─────────────────────────────────────────────

set -g mouse on
set -g mode-keys vi
set -g status-keys emacs

set -s escape-time 0
set -g history-limit 100000

# window / pane index starts at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# auto-rename window based on current program
setw -g automatic-rename on

# true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"
set -as terminal-overrides ",*256col*:Tc"


# ─────────────────────────────────────────────
# Window / Pane shortcuts
# ─────────────────────────────────────────────

# new window, keep current path
bind c new-window -c "#{pane_current_path}"

# rename window
unbind ,
bind , command-prompt -p "Rename window:" "rename-window '%%'"

# window switching
bind -r C-p previous-window
bind -r C-n next-window

# Alt + number to switch window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# split pane, keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane switching: Alt + h/j/k/l
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# pane zoom
bind -n M-f resize-pane -Z

# fzf pane switcher
set-hook -g pane-focus-in 'run-shell -b "bash ~/.config/tmux/scripts/pane_switcher.sh update_mru_pane_ids"'

# popup shell and persistent scratch workspace
bind g run-shell -b "bash ~/.config/tmux/scripts/popup.sh shell"
bind G run-shell -b "bash ~/.config/tmux/scripts/popup.sh scratch"

# toggle right-side machine status
bind i run-shell -b "bash ~/.config/tmux/scripts/status_toggle.sh toggle >/dev/null 2>&1 || true"

# ─────────────────────────────────────────────
# Copy mode (relies on iTerm2 mirroring paste buffer to clipboard on macOS)
# ─────────────────────────────────────────────

set -g set-clipboard on

bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode MouseDown1Pane select-pane

bind -n M-v copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

bind -T copy-mode y send-keys -X copy-pipe-and-cancel
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Ctrl-u / Ctrl-e to scroll in copy mode
unbind -T copy-mode-vi C-u
unbind -T copy-mode-vi C-e
bind -T copy-mode-vi C-u send-keys -N 5 -X scroll-up
bind -T copy-mode-vi C-e send-keys -N 5 -X scroll-down


# ─────────────────────────────────────────────
# Style — Catppuccin Mocha
# ─────────────────────────────────────────────

set -g @tmux_bg "#1e1e2e"
set -g @tmux_fg "#cdd6f4"
set -g @tmux_muted "#6c7086"
set -g @tmux_surface "#313244"
set -g @tmux_surface2 "#45475a"
set -g @tmux_accent "#89b4fa"
set -g @tmux_session "#94e2d5"

set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 1

set -g status-left-length 24
set -g status-right-length 24

set -g status-style "fg=#{@tmux_fg},bg=#{@tmux_bg}"
set -g status-left-style "fg=#{@tmux_fg},bg=#{@tmux_bg}"
set -g status-right-style "fg=#{@tmux_fg},bg=#{@tmux_bg}"

# Browser-style tabs: one layout helper owns the shared width budget for the
# window list and the optional right-side machine status.
if-shell -F '#{==:#{@tmux_status_preference},}' 'set -g @tmux_status_preference "on"'
set -g @tmux_status_density "compact"
set -g @tmux_status_left_budget "24"
set -g @tmux_status_right_budget_full "108"
set -g @tmux_status_right_budget_full_max "160"
set -g @tmux_status_right_budget_medium "38"
set -g @tmux_status_right_budget_compact "24"
set -g @tmux_status_right_budget "24"
set -g @tmux_tab_min_title_width "3"
set -g @tmux_tab_max_title_width "18"
set -g @tmux_tab_fixed_width "6"
set -g @tmux_tab_desired_full_width "10"
set -g @tmux_tab_desired_medium_width "7"
set -g @tmux_tab_desired_compact_width "3"
set -g @tmux_status_many_windows_threshold "10"
set -g @tmux_tab_title_width "12"
set -g @tmux_tab_trim_width "12"

# left: compact session block
set -g status-left "#[fg=#{@tmux_bg},bg=#{@tmux_session},bold] #S #[fg=#{@tmux_session},bg=#{@tmux_bg}] "

# right: host and machine status, with GPU data when nvidia-smi is available
set -g status-right "#(TMUX_STATUS_DENSITY='#{@tmux_status_density}' TMUX_STATUS_BUDGET='#{@tmux_status_right_budget}' ~/.config/tmux/scripts/status_info.sh)"

# window tabs
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#{@tmux_accent},bg=#{@tmux_bg}] #I #[fg=#{@tmux_fg},bg=#{@tmux_bg}]#{p/#{E:@tmux_tab_title_width}:#{=/#{E:@tmux_tab_trim_width}/…:window_name}} "
setw -g window-status-current-format "#[fg=#{@tmux_accent},bg=#{@tmux_bg}]#[fg=#{@tmux_bg},bg=#{@tmux_accent},bold] #I #{p/#{E:@tmux_tab_title_width}:#{=/#{E:@tmux_tab_trim_width}/…:window_name}} #[fg=#{@tmux_accent},bg=#{@tmux_bg}]"

# Recalculate the shared tab/status budget when the available width or window
# count changes. The script is cheap: it only sets tmux layout options.
set-hook -g client-resized "run-shell -b \"bash ~/.config/tmux/scripts/status_layout.sh apply -t '#{session_id}' -c '#{client_tty}'\""
set-hook -g client-attached "run-shell -b \"bash ~/.config/tmux/scripts/status_layout.sh apply -t '#{session_id}' -c '#{client_tty}'\""
set-hook -g client-session-changed "run-shell -b \"bash ~/.config/tmux/scripts/status_layout.sh apply -t '#{session_id}' -c '#{client_tty}'\""
set-hook -g after-new-session "run-shell -b \"bash ~/.config/tmux/scripts/status_layout.sh apply -t '#{session_id}' -c '#{client_tty}'\""
set-hook -g after-new-window "run-shell -b \"bash ~/.config/tmux/scripts/status_layout.sh apply -t '#{session_id}' -c '#{client_tty}'\""
set-hook -g window-linked "run-shell -b \"bash ~/.config/tmux/scripts/status_layout.sh apply -t '#{session_id}' -c '#{client_tty}'\""
set-hook -g window-unlinked "run-shell -b \"bash ~/.config/tmux/scripts/status_layout.sh apply -t '#{session_id}' -c '#{client_tty}'\""
set-hook -g after-rename-window "run-shell -b \"bash ~/.config/tmux/scripts/status_layout.sh apply -t '#{session_id}' -c '#{client_tty}'\""

# activity / bell
setw -g window-status-activity-style "fg=#f9e2af,bg=#{@tmux_surface}"
setw -g window-status-bell-style "fg=#f38ba8,bg=#{@tmux_surface}"

# message / command bar
set -g message-style "fg=#{@tmux_bg},bg=#{@tmux_accent},bold"
set -g message-command-style "fg=#{@tmux_bg},bg=#{@tmux_accent},bold"

# copy-mode selection
setw -g mode-style "fg=#{@tmux_bg},bg=#{@tmux_accent},bold"


# ─────────────────────────────────────────────
# Pane border
# ─────────────────────────────────────────────

setw -g pane-border-status off

set -g pane-border-style "fg=#{@tmux_surface2}"
set -g pane-active-border-style "fg=#{@tmux_accent}"

setw -g pane-border-format "#{?window_zoomed_flag, zoomed ,}"

# ─────────────────────────────────────────────
# Plugins (TPM)
# ─────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'laktak/extrakto'

if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run-shell -b "~/.tmux/plugins/tpm/tpm"'

# ─────────────────────────────────────────────
# Override tmux-logging key bindings
# Keep Ctrl-b P for pane switcher
# ─────────────────────────────────────────────

unbind P
unbind M-p
unbind M-P
unbind M-c

bind P run-shell -b "bash ~/.config/tmux/scripts/pane_switcher.sh new_window"
bind L run-shell '~/.tmux/plugins/tmux-logging/scripts/toggle_logging.sh'
bind M-l run-shell '~/.tmux/plugins/tmux-logging/scripts/screen_capture.sh'
bind M-L run-shell '~/.tmux/plugins/tmux-logging/scripts/save_complete_history.sh'
bind M-c run-shell '~/.tmux/plugins/tmux-logging/scripts/clear_history.sh'

# Machine-local overrides. Keep this last so each host can adjust status bar
# placement, status-right, or popup defaults without forking the shared config.
source-file -q ~/.tmux.local.conf
if-shell -F '#{==:#{status-right},}' 'set -g @tmux_status_preference off'
run-shell -b "bash ~/.config/tmux/scripts/status_layout.sh apply-all"
